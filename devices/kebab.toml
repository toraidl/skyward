[device]
codename = "kebab"
brand = "OnePlus"
model = "OnePlus 8T"
ab = true
soc = { hans = "骁龙®865 移动平台", hant = "Snapdragon® 865 行動平台", en = "Snapdragon® 865 Mobile Platform" }
os_version_prop = "ro.build.version.ota"

[display]
# The panel's own mode as the phone reports it: 1080 by 2400 at 480 dpi,
# the 6.55-inch AMOLED of the KB2000.
width = 1080
height = 2400
density = 480
diagonal = 6.55
corner_radius = 100
# Android reports the top-left cutout's bounds as x=0..165, y=0..103.
# Leave another 24 physical pixels between that region and the clock.
status_bar_left_inset = 189

# QCA6390 is built into the recovery kernel. Stage firmware before telling
# CNSS that the filesystem is ready; never borrow a module from another build.
[wlan]
modules = []
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "qca6390/amss20.bin", partition = "modem", slotselect = true, filesystem = "vfat", path = "image/qca6390/amss20.bin" },
    { name = "qca6390/m3.bin", partition = "modem", slotselect = true, filesystem = "vfat", path = "image/qca6390/m3.bin" },
    { name = "qca6390/bdwlan.elf", partition = "modem", slotselect = true, filesystem = "vfat", path = "image/qca6390/bdwlan.elf" },
    # The retained recovery kernel has Oplus's flat INI path and no
    # MULTI_IF_NAME prefix for its built-in wlan driver.
    { name = "wlan/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/qca6390/WCNSS_qcom_cfg.ini" },
    # Stock init already mounts persist as ext4 here. Reuse that mount;
    # probing/mounting its block device again can fail before reaching ext4.
    { name = "wlan/qca_cld/wlan_mac.bin", path = "/mnt/vendor/persist/qca6390/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/vendor/lib64", "/system/lib64"]
hardware_services = [
    "android.hardware.wifi.supplicant@1.0::ISupplicant/default",
    "android.hardware.wifi.supplicant@1.1::ISupplicant/default",
    "android.hardware.wifi.supplicant@1.2::ISupplicant/default",
    "android.hardware.wifi.supplicant@1.3::ISupplicant/default",
    "vendor.qti.hardware.wifi.supplicant@2.0::ISupplicantVendor/default",
    "vendor.qti.hardware.wifi.supplicant@2.1::ISupplicantVendor/default",
    "vendor.qti.hardware.wifi.supplicant@2.2::ISupplicantVendor/default",
    "vendor.oplus.hardware.wifi.supplicant@2.0::IOplusSupplicant/default",
]
probe = "http://connectivitycheck.gstatic.com/generate_204"

# /metadata keeps the key the data partition opens with and what libsnapshot
# needs. The stock recovery mounts it as it starts; a recovery that replaces
# its binary has to mount it itself, and before anything tries to open data.
[partitions]
mounted = ["metadata"]

# The phone's hardware services, which the stock recovery starts only when
# its own recovery binary sets a property as it decrypts. Skyward starts
# them itself, in the order they depend on one another: the directory the
# older kind registers with, the secure world's listener daemon, the key
# service, the credential service and the boot control.
[[service]]
path = "/system/bin/hwservicemanager"
libraries = ["/system/lib64"]
ready_property = "hwservicemanager.ready"
user = "root"
groups = ["root"]

# The daemon the secure world reaches back into Android through. Until its
# listeners are registered, the secure world's apps, the key service among
# them, cannot run.
[[service]]
path = "/system/bin/qseecomd"
libraries = ["/system/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root"]

# The key service, the only thing that can use the keys the phone wrapped
# in hardware.
[[service]]
path = "/system/bin/android.hardware.keymaster@4.1-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.keymaster@4.1::IKeymasterDevice/default"
user = "system"
groups = ["system", "drmrpc"]

# The credential service, which is what the secure world has check the
# secret behind a screen lock.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"
user = "root"
groups = ["root"]

# The boot control, which says which slot the bootloader starts next and
# switches it. It comes last: the phone is usable without it.
[[service]]
path = "/vendor/bin/hw/android.hardware.boot@1.1-service"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.boot@1.1::IBootControl/default"
user = "root"
groups = ["root"]

# The stock ColorOS 14 build the ColorOS 17 port for this phone is based
# on. Its recovery partition is the stock one: unlike the port's own full
# package, whose recovery partition is an OrangeFox build, it carries the
# phone maker's recovery init, adbd, SELinux policy and keymaster service.
# The package is already on the computer that builds this image; a build
# elsewhere gives the address the phone maker serves it at instead.
[stock]
version = "14.0.0.602"
package = "/home/bruce/coloros_port/KB2000_14.0.0.602.zip"
recovery = "6286ad199599cf15fc4a9634d213432985167ed05dd2cf59e2c57e8a20f59072"
